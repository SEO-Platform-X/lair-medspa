name: grab
on:
  push:
    paths: ['grab/list.txt','grab/grab.py','.github/workflows/grab.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf grab/out && python3 grab/grab.py
      - run: |
          git config user.name grab-bot; git config user.email grab@users.noreply.github.com
          git add grab/out && git commit -m "grab assets" && git push || echo nothing
